name: "honeyledger"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/honeyledger:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
      - selenium
      - postgres

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped
    # System tests run in up to eight parallel workers (test/test_helper.rb),
    # each needing its own browser session. The image defaults to one session
    # and caps sessions at the CPU count unless overridden. Several Chromes
    # also need more shared memory than Docker's 64 MB default.
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 8
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

  postgres:
    image: postgres:18
    restart: unless-stopped
    networks:
      - default
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  postgres-data:
